# Hooks for ripple_effect_csharp_integration.
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push   once, per clone
#   pre-commit run --all-files                                       to sweep the tree
#
# The secret scan is TruffleHog over what is staged, at the version mise.toml
# pins — `mise install` puts it and every other tool the hooks run on the
# machine, and `mise run doctor` says what is missing. Without it the hook
# fails and says so rather than letting the commit through unscanned. CI's
# `.github/workflows/secrets.yml` runs the same scan over everything pushed.
#
# Formatting is checked, never applied: a hook that rewrites a file under you
# turns one failed commit into two. `dotnet format RippleFx.sln` by hand.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=512']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: ^(src/RippleFx.Engine/Interop/|tests/RippleFx.Engine.Tests/layout.json)

  - repo: local
    hooks:
      - id: trufflehog
        name: secret scan
        entry: bash tool/trufflehog/scan.sh
        language: system
        pass_filenames: false
        always_run: true

      # Whitespace only, file by file, with no build: the style the
      # analyzers enforce is checked before a push, where a build is paid for.
      - id: dotnet-format
        name: dotnet format whitespace (check)
        entry: dotnet format whitespace --folder --verify-no-changes --include
        language: system
        types: [c#]
        exclude: ^src/RippleFx.Engine/Interop/

      # The analyzers, the formatting and the whole suite before a push, on
      # the pinned engine (or RIPPLE_ENGINE_TREE's).
      - id: test
        name: format, build and test
        entry: bash tool/pre_push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
